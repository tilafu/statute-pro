# Nginx configuration for statutepro (Next.js)
# Place this file at: /etc/nginx/sites-available/statutepro
# Then symlink: sudo ln -s /etc/nginx/sites-available/statutepro /etc/nginx/sites-enabled/

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name statutepro.com www.statutepro.com;

    # Required for Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name statutepro.com www.statutepro.com;

    # --- SSL (issued by Certbot / Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/statutepro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statutepro.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # --- Logging ---
    access_log /var/log/nginx/statutepro.access.log;
    error_log  /var/log/nginx/statutepro.error.log;

    # --- Gzip compression ---
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_vary       on;

    # --- Static assets (Next.js _next/static) – long cache ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    # --- Service worker – no cache ---
    location /sw.js {
        proxy_pass http://127.0.0.1:3000/sw.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        proxy_set_header Host $host;
    }

    # --- Public static files (icons, markers, manifests) ---
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot|otf)$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
        proxy_set_header Host $host;
    }

    # --- Proxy all other requests to Next.js ---
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;

        # Allow large uploads (profile pictures, etc.)
        client_max_body_size 20M;
    }
}
